server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # YouTube-data endpoints (transcript, channel, video, suggest) forwarded
    # to the free hosted proxy server-side, so they work from any origin.
    location /api/ {
        proxy_pass https://yt-transcript-proxy.pages.dev;
        proxy_http_version 1.1;
        proxy_set_header Host yt-transcript-proxy.pages.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
        proxy_ssl_name yt-transcript-proxy.pages.dev;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
